<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>简单待办</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="bar" id="bar">
      <button class="ibtn" id="btn-add" title="新建待办 (Ctrl+N)" aria-label="新建待办">
        <svg viewBox="0 0 16 16"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg>
      </button>
      <button class="ibtn" id="btn-back" title="返回 (Esc)" aria-label="返回" hidden>
        <svg viewBox="0 0 16 16"><path d="M9.8 3.4 5.2 8l4.6 4.6"/></svg>
      </button>
      <span class="bar-title" id="bar-title" hidden>已完成</span>
      <div class="grow"></div>
      <button class="ibtn" id="btn-pin" title="置顶显示" aria-label="置顶显示">
        <svg viewBox="0 0 16 16"><path d="M4 13.5h8"/><path d="M8 11.2V2.8"/><path d="M5.2 5.6 8 2.8l2.8 2.8"/></svg>
      </button>
      <button class="ibtn" id="btn-history" title="历史完成 (Ctrl+H)" aria-label="历史完成">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.4"/><path d="M8 5.1v3.2l2.1 1.3"/></svg>
      </button>
      <button class="ibtn" id="btn-more" title="更多" aria-label="更多">
        <svg viewBox="0 0 16 16" class="dots"><path d="M4 8h.01M8 8h.01M12 8h.01"/></svg>
      </button>
      <button class="ibtn close" id="btn-close" title="收进托盘" aria-label="收进托盘">
        <svg viewBox="0 0 16 16"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>
      </button>
    </header>

    <main class="view" id="view-main">
      <ul class="list" id="list"></ul>
      <div class="addrow" id="addrow" role="button" tabindex="0">
        <span class="dash"></span>
        <span>添加待办</span>
      </div>
    </main>

    <main class="view" id="view-history" hidden>
      <div class="hlist" id="hlist"></div>
      <div class="hfoot">
        <button class="linkbtn" id="btn-clear">清空历史</button>
      </div>
    </main>

    <div class="toast" id="toast" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" hidden>撤销</button>
    </div>

    <div class="menu" id="menu" hidden>
      <button class="mi" id="mi-startup">
        <span class="ck" id="ck-startup"></span>开机自动启动
      </button>
      <button class="mi" id="mi-folder">
        <span class="ck blank"></span>打开数据文件夹
      </button>
      <button class="mi" id="mi-about">
        <span class="ck blank"></span>关于简单待办
      </button>
      <div class="sep"></div>
      <button class="mi" id="mi-quit">
        <span class="ck blank"></span>退出
      </button>
    </div>
  </div>

  <div class="rz n" data-rz="n"></div>
  <div class="rz s" data-rz="s"></div>
  <div class="rz w" data-rz="w"></div>
  <div class="rz e" data-rz="e"></div>
  <div class="rz nw" data-rz="nw"></div>
  <div class="rz ne" data-rz="ne"></div>
  <div class="rz sw" data-rz="sw"></div>
  <div class="rz se" data-rz="se"></div>

  <script src="renderer.js"></script>
</body>
</html>
