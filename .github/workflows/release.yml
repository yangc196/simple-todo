name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.0.1

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate tag and package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($package.version -ne $lock.version) {
            throw "package.json ($($package.version)) and package-lock.json ($($lock.version)) versions differ"
          }
          if ($env:RELEASE_TAG -ne "v$($package.version)") {
            throw "Release tag $env:RELEASE_TAG does not match package version $($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run dist -- --publish never

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json -AsHashtable
          $source = "dist/简单待办-$($package.version).exe"
          $name = "SimpleTodo-Setup-$($package.version).exe"
          $path = "dist/$name"
          if (-not (Test-Path $source)) {
            Get-ChildItem dist -Force | Format-Table | Out-String | Write-Error
            throw "Expected installer not found: $source"
          }
          Move-Item -Path $source -Destination $path -Force
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "label=简单待办-$($package.version).exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.installer.outputs.path }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Set Chinese display label
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ASSET_NAME: ${{ steps.installer.outputs.name }}
          ASSET_LABEL: ${{ steps.installer.outputs.label }}
        with:
          script: |
            const { owner, repo } = context.repo
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: process.env.RELEASE_TAG,
            })
            const asset = release.data.assets.find(
              item => item.name === process.env.ASSET_NAME
            )
            if (!asset) {
              throw new Error(`Release asset not found: ${process.env.ASSET_NAME}`)
            }
            await github.rest.repos.updateReleaseAsset({
              owner,
              repo,
              asset_id: asset.id,
              name: process.env.ASSET_NAME,
              label: process.env.ASSET_LABEL,
            })
