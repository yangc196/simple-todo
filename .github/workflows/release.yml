name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.0.1

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate tag and package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          if ($package.version -ne $lock.version) {
            throw "package.json ($($package.version)) and package-lock.json ($($lock.version)) versions differ"
          }
          if ($env:RELEASE_TAG -ne "v$($package.version)") {
            throw "Release tag $env:RELEASE_TAG does not match package version $($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run dist

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $path = "dist/简单待办-$($package.version).exe"
          if (-not (Test-Path $path)) {
            Get-ChildItem dist -Force | Format-Table | Out-String | Write-Error
            throw "Expected installer not found: $path"
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.installer.outputs.path }}
          overwrite_files: true
          fail_on_unmatched_files: true
